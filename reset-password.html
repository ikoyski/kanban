<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The reset token is in this page's URL; never leak it to other sites via the Referer header. -->
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Reset Password - Kanban</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554',
                        }
                    }
                }
            }
        }
        // Follow the theme chosen in the app (same localStorage key as kanban.html).
        if (localStorage.getItem('kanban-theme') === 'dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-8">
            <div class="text-center mb-8">
                <div class="bg-primary-600 text-white w-12 h-12 rounded-lg shadow-lg flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                </div>
                <h1 id="page-title" class="text-2xl font-bold text-slate-800 dark:text-slate-100">Choose a New Password</h1>
                <p id="page-subtitle" class="text-slate-500 dark:text-slate-400 text-sm mt-2">Enter and confirm your new password below</p>
            </div>

            <!-- Error banner (invalid/expired link, API errors) -->
            <div id="reset-error" class="hidden mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-800 dark:text-red-200 text-sm" role="alert"></div>

            <!-- Reset form -->
            <form id="reset-form" class="space-y-4 hidden">
                <div>
                    <label for="new-password" class="block text-sm font-medium mb-1 opacity-70">New Password</label>
                    <input type="password" id="new-password" required minlength="8" autocomplete="new-password" class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                </div>
                <div>
                    <label for="confirm-password" class="block text-sm font-medium mb-1 opacity-70">Confirm New Password</label>
                    <input type="password" id="confirm-password" required autocomplete="new-password" class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                </div>
                <label class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400 cursor-pointer select-none">
                    <input type="checkbox" id="show-passwords" class="rounded border-slate-300 dark:border-slate-600 text-primary-600 focus:ring-primary-500">
                    Show passwords
                </label>
                <button type="submit" id="reset-submit" class="w-full py-2 px-4 bg-primary-600 hover:bg-primary-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold rounded-lg shadow-md transition-all active:scale-95">Reset Password</button>
            </form>

            <!-- Success state -->
            <div id="reset-success" class="hidden space-y-4">
                <div class="p-3 rounded-lg bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800 text-green-800 dark:text-green-200 text-sm" role="status">
                    Your password has been reset. You can now sign in with your new password.
                </div>
                <a href="kanban.html" class="block w-full py-2 px-4 bg-primary-600 hover:bg-primary-700 text-white text-center font-bold rounded-lg shadow-md transition-all active:scale-95">Go to Sign In</a>
            </div>

            <!-- Shown when the link is missing/invalid/expired -->
            <div id="reset-retry" class="hidden mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
                <a href="kanban.html" class="text-primary-600 hover:underline font-medium">Back to sign in to request a new link</a>
            </div>
        </div>
    </main>
    <footer class="border-t border-slate-200 dark:border-slate-800">
        <div class="max-w-6xl mx-auto px-5 py-6 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-500 dark:text-slate-400">
            <span>Open source under the GPL-3.0 license.</span>
            <nav class="flex gap-5">
                <a href="index.html" class="hover:text-primary-600 dark:hover:text-primary-400">Home</a>
                <a href="privacy.html" class="hover:text-primary-600 dark:hover:text-primary-400">Privacy</a>
                <a href="terms.html" class="hover:text-primary-600 dark:hover:text-primary-400">Terms</a>
            </nav>
        </div>
    </footer>

    <script type="module">
        import ApiClient from './src/js/api.js';

        const form = document.getElementById('reset-form');
        const errorBox = document.getElementById('reset-error');
        const successBox = document.getElementById('reset-success');
        const retryBox = document.getElementById('reset-retry');
        const title = document.getElementById('page-title');
        const subtitle = document.getElementById('page-subtitle');
        const submitBtn = document.getElementById('reset-submit');
        const newPassword = document.getElementById('new-password');
        const confirmPassword = document.getElementById('confirm-password');

        // Read the token once, then take it out of the address bar/history. It stays in memory only.
        const token = new URLSearchParams(window.location.search).get('token');
        if (token) history.replaceState(null, '', window.location.pathname);

        function showError(message, { offerRetry = false } = {}) {
            errorBox.textContent = message;
            errorBox.classList.remove('hidden');
            retryBox.classList.toggle('hidden', !offerRetry);
        }

        if (!token) {
            title.textContent = 'Invalid Reset Link';
            subtitle.textContent = 'This password reset link is missing or incomplete.';
            showError('Please use the link from your email, or request a new one.', { offerRetry: true });
        } else {
            form.classList.remove('hidden');
            newPassword.focus();
        }

        document.getElementById('show-passwords').onchange = (e) => {
            const type = e.target.checked ? 'text' : 'password';
            newPassword.type = type;
            confirmPassword.type = type;
        };

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');

            if (newPassword.value.length < 8) {
                showError('Password must be at least 8 characters long.');
                newPassword.focus();
                return;
            }
            if (newPassword.value !== confirmPassword.value) {
                showError('Passwords do not match.');
                confirmPassword.focus();
                return;
            }

            submitBtn.disabled = true;
            try {
                await ApiClient.resetPassword(token, newPassword.value);
                form.classList.add('hidden');
                retryBox.classList.add('hidden');
                title.textContent = 'Password Reset';
                subtitle.textContent = 'All done!';
                successBox.classList.remove('hidden');
            } catch (error) {
                // The API answers 400 with a message such as "Invalid or expired reset token".
                const expired = /token/i.test(error.message);
                showError(error.message, { offerRetry: expired });
                if (expired) form.classList.add('hidden');
            } finally {
                submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>

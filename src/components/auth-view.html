<div id="app-auth-view" class="flex-1 flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-900">
        <!-- Sign-in is handled by the auth server using OAuth 2.0 Authorization Code + PKCE -->
        <div id="signin-card" class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-8 transition-all">
            <div class="text-center mb-8">
                <div class="bg-primary-600 text-white w-12 h-12 rounded-lg shadow-lg flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6 0h3m-3 4h3" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Welcome</h2>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Choose your preferred sign-in provider on the next screen</p>
            </div>
            <div id="auth-message" role="alert" class="hidden mb-4 p-3 rounded-lg text-sm bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800 textx-center"></div>
            <button id="signin-btn" type="button" class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 font-medium text-slate-700 dark:text-slate-100 transition-colors">
                <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14" />
                    <path d="m12 5 7 7-7 7" />
                </svg>
                <span>Continue to sign in</span>
            </button>
            <p class="mt-4 text-center text-xs text-slate-500 dark:text-slate-400">
                By continuing you agree to the
                <a href="terms.html" class="underline hover:text-primary-600">Terms of Use</a> and
                <a href="privacy.html" class="underline hover:text-primary-600">Privacy Policy</a>.
            </p>
            <p class="mt-3 text-center text-xs text-slate-500 dark:text-slate-400">
                <a href="./" class="hover:text-primary-600">Back to Homepage</a>
            </p>
        </div>
    </div>

<div id="card-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity"></div>
        <div class="relative bg-white dark:bg-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl transform transition-all scale-95 opacity-0 duration-200">
            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 id="modal-title" class="text-xl font-bold">Add New Card</h2>
                    <button id="close-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <form id="card-form" class="space-y-4">
                    <input type="hidden" id="column-id">
                    <div>
                        <label class="block text-sm font-medium mb-1 opacity-70">Title *</label>
                        <input type="text" id="form-title" required class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 opacity-70">Description</label>
                        <div id="form-description"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1 opacity-70">Priority</label>
                            <div class="flex gap-2">
                                <label class="flex-1">
                                    <input type="radio" name="priority" value="LOW" class="hidden peer">
                                    <span class="block text-center py-1 px-2 rounded-md border border-slate-200 dark:border-slate-700 cursor-pointer peer-checked:bg-green-100 peer-checked:text-green-700 peer-checked:border-green-500 dark:peer-checked:bg-green-900/30 dark:peer-checked:text-green-400 text-xs font-medium transition-all">Low</span>
                                </label>
                                <label class="flex-1">
                                    <input type="radio" name="priority" value="MEDIUM" class="hidden peer" checked>
                                    <span class="block text-center py-1 px-2 rounded-md border border-slate-200 dark:border-slate-700 cursor-pointer peer-checked:bg-yellow-100 peer-checked:text-yellow-700 peer-checked:border-yellow-500 dark:peer-checked:bg-yellow-900/30 dark:peer-checked:text-yellow-400 text-xs font-medium transition-all">Med</span>
                                </label>
                                <label class="flex-1">
                                    <input type="radio" name="priority" value="HIGH" class="hidden peer">
                                    <span class="block text-center py-1 px-2 rounded-md border border-slate-200 dark:border-slate-700 cursor-pointer peer-checked:bg-red-100 peer-checked:text-red-700 peer-checked:border-red-500 dark:peer-checked:bg-red-900/30 dark:peer-checked:text-red-400 text-xs font-medium transition-all">High</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 opacity-70">Due Date</label>
                            <input type="date" id="form-date" class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition-all text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 opacity-70">Labels (comma separated)</label>
                        <input type="text" id="form-labels" placeholder="e.g. UI, API, Bug" class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                    </div>
                    <div class="flex justify-end gap-3 pt-4">
                        <button type="button" id="cancel-modal" class="px-4 py-2 text-sm font-medium text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-colors">Cancel</button>
                        <button type="submit" class="px-6 py-2 text-sm font-bold text-white bg-primary-600 hover:bg-primary-700 rounded-lg shadow-md transition-all active:scale-95">Save Card</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
